<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sagrada Biblia</title>
<meta name="theme-color" content="#FBFBF9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan: un breviario de bolsillo. Papel neutro, tinta casi negra, y un único acento
   que sigue el color litúrgico del día (verde, morado, dorado, rojo).
   Lectura en Literata; controles en Instrument Sans. Una columna, barra inferior fija. */
:root{
  --paper:#FBFBF9; --surface:#F1F1EE; --ink:#1D1D1B; --muted:#686864; --line:#E2E2DD;
  --acc-l:#2E6B4E; --acc-d:#86C9A4; --accent:var(--acc-l); --on-accent:#fff;
  --tint:color-mix(in srgb,var(--accent) 12%,transparent);
  --hl:#F6E7A6; --hl-ink:inherit;
  --serif:"Literata",Georgia,"Noto Serif",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs:19px; --lh:1.62;
  --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17181A; --surface:#212226; --ink:#E9E8E4; --muted:#9C9B96; --line:#303236;
    --accent:var(--acc-d); --on-accent:#141414; --hl:#5A4C17; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#17181A; --surface:#212226; --ink:#E9E8E4; --muted:#9C9B96; --line:#303236;
  --accent:var(--acc-d); --on-accent:#141414; --hl:#5A4C17; color-scheme:dark;
}
:root[data-mode="light"]{
  --paper:#FBFBF9; --surface:#F1F1EE; --ink:#1D1D1B; --muted:#686864; --line:#E2E2DD;
  --accent:var(--acc-l); --on-accent:#fff; --hl:#F6E7A6; color-scheme:light;
}
:root[data-mode="dark"]{
  --paper:#17181A; --surface:#212226; --ink:#E9E8E4; --muted:#9C9B96; --line:#303236;
  --accent:var(--acc-d); --on-accent:#141414; --hl:#5A4C17; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
.app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
header.top{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--line);background:var(--paper);position:relative;z-index:5}
.top .title{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:10px;text-align:left}
.top .title:hover{background:var(--surface)}
.top .title b{font-family:var(--serif);font-weight:600;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .title .caret{color:var(--muted);flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;white-space:nowrap;background:var(--paper)}
.chip:hover{border-color:var(--accent)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface);color:var(--ink)}
.icon-btn svg,.nav svg{width:22px;height:22px}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:auto}
.pad{padding:16px 18px 32px}
nav.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--paper);padding-bottom:env(safe-area-inset-bottom)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:500}
.nav a[aria-current="page"]{color:var(--accent)}
.nav a[aria-current="page"] svg{stroke-width:2.2}

/* Reader */
.reader{padding:22px 22px 40px;font-family:var(--serif);font-size:var(--fs);line-height:var(--lh);max-width:68ch;margin:0 auto}
.reader h2{font-family:var(--serif);font-weight:500;font-size:15px;color:var(--muted);margin:0 0 14px;letter-spacing:.01em}
.reader .text{hyphens:auto;-webkit-hyphens:auto;text-align:left}
.dropnum{float:left;font-size:3.3em;line-height:.86;font-weight:600;color:var(--accent);margin:.04em .14em 0 0;font-variant-numeric:lining-nums}
.v{border-radius:3px;transition:background .15s}
.v sup{font-family:var(--sans);font-size:.58em;font-weight:600;color:var(--accent);margin:0 .18em 0 .1em;vertical-align:.55em;line-height:0;font-variant-numeric:tabular-nums}
.v.hl{background:var(--hl)}
.v.sel{background:var(--tint);box-shadow:0 2px 0 var(--accent)}
.v.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--tint)}100%{background:transparent}}
.lines .v{display:block;margin-bottom:.35em}
.lines .dropnum{float:none;display:block;font-size:2.2em;margin:0 0 .1em}
.prose .v{display:block;margin-bottom:.8em}
.prose .v sup{vertical-align:.5em}
.reader[dir="rtl"] .dropnum{float:right;margin:.04em 0 0 .14em}
.chap-end{margin-top:28px;display:flex;flex-direction:column;gap:14px;font-family:var(--sans);font-size:16px}
.readbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;border:1.5px solid var(--accent);color:var(--accent);font-weight:600}
.readbtn.done{background:var(--accent);color:var(--on-accent)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pn button{padding:12px 14px;border-radius:12px;background:var(--surface);text-align:left;min-height:56px}
.pn button:last-child{text-align:right}
.pn small{display:block;color:var(--muted);font-size:12.5px}
.pn button:disabled{opacity:.35;cursor:default}
.attrib{color:var(--muted);font-size:12.5px;line-height:1.45;font-family:var(--sans)}
.notice{background:var(--surface);border-radius:14px;padding:16px;font-family:var(--sans);font-size:15px;line-height:1.5}
.notice .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}


/* Verses as separate paragraphs (default) */
.chnum{font-family:var(--serif);font-weight:600;font-size:2.7em;line-height:1;color:var(--accent);margin:2px 0 10px;font-variant-numeric:lining-nums}
.sep .vv{display:grid;grid-template-columns:2em 1fr;column-gap:.55em;margin:0 0 .85em;padding:.12em .3em .12em 0;border-radius:6px}
.sep .vv .n{font-family:var(--sans);font-size:.6em;font-weight:600;color:var(--accent);text-align:end;padding-top:.62em;font-variant-numeric:tabular-nums;user-select:none}
.sep .vv .t{white-space:pre-line}
.prose .vv{display:block;margin:0 0 .9em}
.prose .vv .n{font-family:var(--sans);font-size:.6em;font-weight:600;color:var(--accent);margin-inline-end:.4em;vertical-align:.5em}
.flowp{margin:0 0 .9em}
.flow .v sup{font-family:var(--sans);font-size:.58em;font-weight:600;color:var(--accent);margin:0 .18em 0 .1em;vertical-align:.55em;line-height:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd{margin:1.5em 0 .7em;text-wrap:balance}
.sep .hd{padding-inline-start:2.55em}
.hd:first-child{margin-top:.3em}
.hd.hS{font-family:var(--serif);font-weight:600;font-size:1.04em;line-height:1.35;color:var(--ink)}
.hd.hM{font-family:var(--sans);font-weight:600;font-size:.74em;letter-spacing:.03em;line-height:1.4;color:var(--muted);margin-bottom:.3em}
.hd.hP,.hd.hD{font-family:var(--serif);font-weight:400;font-style:italic;font-size:.9em;line-height:1.45;color:var(--muted);margin:.3em 0 .8em}
.hd.hA{font-family:var(--serif);font-weight:600;font-size:.9em;color:var(--accent);margin:1em 0 .4em}
.fn{display:inline-block;font-family:var(--sans);font-weight:700;font-size:.72em;line-height:1;color:var(--accent);vertical-align:.5em;padding:.05em .14em;margin:0;border-radius:4px}
.fn:hover{text-decoration:underline}
.notetext{font-family:var(--serif);font-size:17px;line-height:1.6}
.v.speaking{background:var(--tint)}
.player{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);width:min(740px,calc(100% - 20px));
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 8px;display:flex;align-items:center;gap:10px;z-index:19;box-shadow:0 8px 26px rgba(0,0,0,.18)}
.player .plab{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.pbtn svg{width:22px;height:22px}
.pbtn.main{background:var(--accent);color:var(--on-accent)}
body.has-player main .reader{padding-bottom:110px}
body.has-player .actionbar{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 76px)}
.vline{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.vline .vrow{border-bottom:0;flex:1}
.dl{color:var(--muted)}
.dl.on{color:var(--accent)}
.dlw{display:inline-flex;min-width:40px;justify-content:center}

/* Action bar */
.actionbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);width:min(740px,calc(100% - 20px));
  background:var(--ink);color:var(--paper);border-radius:16px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:4px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.actionbar .ref{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actionbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 8px;border-radius:10px;color:inherit}
.actionbar button:hover{background:rgba(127,127,127,.2)}
.actionbar svg{width:20px;height:20px}

/* Lists */
.h1{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.2;margin:4px 0 6px;text-wrap:balance}
.sub{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0 0 16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:12px;padding:3px;gap:3px;margin:0 0 14px}
.seg button{padding:8px 6px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.group{margin:18px 0 6px;font-size:13px;font-weight:600;color:var(--accent)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:hover{background:var(--surface)}
.row .main{flex:1;min-width:0}
.row .name{font-family:var(--serif);font-size:17px;font-weight:500}
.row .meta{color:var(--muted);font-size:13px;margin-top:2px}
.row.off{opacity:.45}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:7px;width:100%}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check svg{width:14px;height:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 18px}
.stat{background:var(--surface);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12.5px}
.stat .bar{margin-top:8px}
.search{display:flex;gap:8px;margin:0 0 16px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 14px;font-size:16px}
.search input:focus{outline:none;border-color:var(--accent)}
.btn{text-decoration:none;display:inline-block;padding:10px 16px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.result{display:block;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.result b{font-size:13.5px;color:var(--accent)}
.result p{margin:4px 0 0;font-family:var(--serif);font-size:16px;line-height:1.5}
.result mark{background:var(--hl);color:inherit;border-radius:2px}
.card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;display:block;width:100%;text-align:left}
.card .k{font-size:13px;color:var(--accent);font-weight:600}
.card .t{font-family:var(--serif);font-size:20px;font-weight:600;margin:3px 0 2px}
.card p{margin:8px 0 0;font-family:var(--serif);line-height:1.5}
.card .note{font-family:var(--sans);font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px;margin-top:10px}
.card .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:40px 20px;line-height:1.55}
.enc{padding:14px 2px;border-bottom:1px solid var(--line)}
.enc .top2{display:flex;gap:10px;align-items:flex-start}
.enc .t{font-family:var(--serif);font-size:18px;font-weight:600;font-style:italic}
.enc .d{color:var(--muted);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.enc p{margin:6px 0 10px;line-height:1.5;font-size:15px}
.enc .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;margin-left:4px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.pope{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 4px;gap:10px}
.pope h3{font-family:var(--serif);font-size:21px;font-weight:600;margin:0}
.pope span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;padding:7px 12px;border-radius:10px;background:var(--surface)}
.toggle.on{background:var(--accent);color:var(--on-accent)}
.toggle svg{width:16px;height:16px}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40;opacity:0;transition:opacity .2s}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(760px,100%);max-height:88%;background:var(--paper);border-radius:20px 20px 0 0;z-index:41;display:flex;flex-direction:column;transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:translate(-50%,0)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 2px;flex:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:8px 18px 10px;flex:none}
.sheet .sh h3{flex:1;margin:0;font-family:var(--serif);font-size:21px;font-weight:600}
.sheet .sb{overflow-y:auto;padding:0 18px 22px}
@media (prefers-reduced-motion: reduce){.sheet,.backdrop,.v{transition:none}.v.flash{animation:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.grid button{aspect-ratio:1;border-radius:12px;background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums;font-size:16px;position:relative}
.grid button.read{background:var(--accent);color:var(--on-accent)}
.grid button.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.grid button.read.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.field{margin:0 0 18px}
.field>label,.field>.lab{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
.field .hint{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.45}
.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);font-size:16px}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.vlang{margin:16px 0 4px;font-size:13px;font-weight:600;color:var(--accent)}
.vrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.vrow .main{flex:1;min-width:0}
.vrow b{font-weight:600}
.vrow .meta{color:var(--muted);font-size:13px;margin-top:2px}
.vrow.cur b{color:var(--accent)}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--surface);color:var(--muted);white-space:nowrap}
.pill.c{color:var(--accent);background:var(--tint)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.credits{font-size:13px;line-height:1.5;color:var(--muted)}
.credits b{color:var(--ink);font-weight:600}
.season{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.season i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.loading{color:var(--muted);font-family:var(--sans);font-size:15px;padding:30px 0;text-align:center}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:6px}
.vgrid button{padding:10px 0;border-radius:10px;background:var(--surface);font-variant-numeric:tabular-nums;font-weight:500}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="view" tabindex="-1"></main>
  <nav class="nav" id="nav" aria-label="Secciones"></nav>
</div>
<div id="layer"></div>
<script>
"use strict";
/* ---------- Static data ---------- */
const BOOKS = {
Gen:['Génesis','Genesis','Gn'],Exod:['Éxodo','Exodus','Ex'],Lev:['Levítico','Leviticus','Lv'],Num:['Números','Numbers','Nm'],Deut:['Deuteronomio','Deuteronomy','Dt'],
Josh:['Josué','Joshua','Jos'],Judg:['Jueces','Judges','Jue'],Ruth:['Rut','Ruth','Rt'],'1Sam':['1 Samuel','1 Samuel','1S'],'2Sam':['2 Samuel','2 Samuel','2S'],
'1Kgs':['1 Reyes','1 Kings','1R'],'2Kgs':['2 Reyes','2 Kings','2R'],'1Chr':['1 Crónicas','1 Chronicles','1Cr'],'2Chr':['2 Crónicas','2 Chronicles','2Cr'],
Ezra:['Esdras','Ezra','Esd'],Neh:['Nehemías','Nehemiah','Neh'],Tob:['Tobías','Tobit','Tb'],Jdt:['Judit','Judith','Jdt'],Esth:['Ester','Esther','Est'],
AddEsth:['Adiciones a Ester','Additions to Esther','AdEst'],'1Macc':['1 Macabeos','1 Maccabees','1M'],'2Macc':['2 Macabeos','2 Maccabees','2M'],
'3Macc':['3 Macabeos','3 Maccabees','3M'],'4Macc':['4 Macabeos','4 Maccabees','4M'],Job:['Job','Job','Job'],Ps:['Salmos','Psalms','Sal'],
Prov:['Proverbios','Proverbs','Pr'],Eccl:['Eclesiastés','Ecclesiastes','Ecl'],Song:['Cantar de los Cantares','Song of Songs','Cant'],
Wis:['Sabiduría','Wisdom','Sab'],Sir:['Eclesiástico (Sirácida)','Sirach','Eclo'],Isa:['Isaías','Isaiah','Is'],Jer:['Jeremías','Jeremiah','Jer'],

/* ---------- State ---------- */
const LS_KEY='biblia.state.v1';
const DEFAULT_STATE=()=>({v:1,updatedAt:0,ui:'es',tradition:'catholic',version:'es-platense',fs:19,mode:'auto',flow:false,heads:true,notes:true,autoRead:false,
  tts:{rate:1,heads:true,next:true,voice:{}},pos:{book:'Gen',ch:1},reading:'bible',apocPos:null,read:{},enc:{},bookmarks:[],hl:{},history:[]});
let S=DEFAULT_STATE();
try{const raw=localStorage.getItem(LS_KEY); if(raw) S=Object.assign(DEFAULT_STATE(),JSON.parse(raw));}catch(e){}
if(!S.tts||typeof S.tts!=='object') S.tts=DEFAULT_STATE().tts;
let remote={ref:null,status:'off',writing:false,pending:false};
let saveTimer=null;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  clearTimeout(saveTimer); saveTimer=setTimeout(pushRemote,1500);
}
async function pushRemote(){
  if(!remote.ref) return;
  if(remote.writing){remote.pending=true;return;}
  remote.writing=true;
  try{await remote.ref.set(JSON.parse(JSON.stringify(S)));}catch(e){ if(e&&e.code==='invalid_argument'){remote.ref=null;remote.status='off';} }
  remote.writing=false;
  if(remote.pending){remote.pending=false;pushRemote();}
}
async function connectRemote(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc('data/users/'+id+'/state');
    const snap=await Promise.race([ref.get(),new Promise(r=>setTimeout(()=>r('timeout'),10000))]);
    if(snap==='timeout') return;
    remote.ref=ref; remote.status='on';
    if(snap.exists){
      const r=snap.data();
      if(r&&r.updatedAt>S.updatedAt){
        const ui=S.ui; S=Object.assign(DEFAULT_STATE(),JSON.parse(JSON.stringify(r)));
        try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
        if(S.ui!==ui) await loadLocale();
        applyPrefs(); render();
      } else if(S.updatedAt>((r&&r.updatedAt)||0)) pushRemote();
    } else if(S.updatedAt>0) pushRemote();
  }catch(e){}
}

function idbGet(k){return new Promise(res=>{if(!idb)return res(null);try{const q=idb.transaction('books').objectStore('books').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});}
function idbPut(k,v){try{if(idb)idb.transaction('books','readwrite').objectStore('books').put(v,k);}catch(e){}}
function idbDel(k){try{if(idb)idb.transaction('books','readwrite').objectStore('books').delete(k);}catch(e){}}
const cacheable=p=>/^data\/(chunks|notes|apoc|i18n)\//.test(p)&&!/apoc\/index/.test(p);
async function getJSON(path){
  if(mem.has(path)) return mem.get(path);
  const p=(async()=>{
    const c=cacheable(path);
    const cached=c?await idbGet(path):null; if(cached) return cached;
    const r=await fetch(path); if(!r.ok) throw new Error(r.status);
    const j=await r.json(); if(c) idbPut(path,j); return j;
  })();
  mem.set(path,p); p.catch(()=>mem.delete(path)); return p;
}
const chunkPath=(vid,i)=>`data/chunks/${vid}.${i}.json`;
const notePath=(vid,i)=>`data/notes/${vid}.${i}.json`;
async function getBook(vid,code){const v=VMAP[vid];const ch=await getJSON(chunkPath(vid,v.chunk[code]));return ch[code];}
async function getNotes(vid,code){const v=VMAP[vid];const n=await getJSON(notePath(vid,v.chunk[code]));return n[code]||{};}
const apocPath=id=>`data/apoc/${id}.json`;

/* offline downloads (per device) */
const DL_KEY='biblia.dl';
let DL={}; try{DL=JSON.parse(localStorage.getItem(DL_KEY)||'{}');}catch(e){}
let dlProgress={};
function versionFiles(v){const n=Math.max(...Object.values(v.chunk))+1;const f=[];for(let i=0;i<n;i++){f.push(chunkPath(v.id,i)); if(v.notes) f.push(notePath(v.id,i));}return f;}
async function downloadVersion(vid,onProg){
  const v=VMAP[vid]; const files=versionFiles(v); let done=0;
  for(const f of files){ await getJSON(f); done++; dlProgress[vid]=Math.round(done*100/files.length); onProg&&onProg(); }
  delete dlProgress[vid]; DL[vid]=Date.now(); try{localStorage.setItem(DL_KEY,JSON.stringify(DL));}catch(e){}
}
function removeDownload(vid){ versionFiles(VMAP[vid]).forEach(f=>{idbDel(f);mem.delete(f);}); delete DL[vid]; try{localStorage.setItem(DL_KEY,JSON.stringify(DL));}catch(e){} }

/* ---------- Canon helpers ---------- */
const V=()=>VMAP[S.version]||VERS[0];
function canonGroups(tr,testament,v){
  v=v||V();
  return CANONS[tr][testament].map(gr=>({g:gr.g,books:gr.b.map(x=>{const opt=x[0]==='?';const c=opt?x.slice(1):x;return {c,opt,has:!!v.chapters[c]};}).filter(b=>!b.opt||b.has)})).filter(gr=>gr.books.length);
}
function canonList(tr,v){return [...canonGroups(tr,'ot',v),...canonGroups(tr,'nt',v)].flatMap(g=>g.books.map(b=>b.c));}
function readingOrder(){const v=V();return canonList(S.tradition,v).filter(c=>v.chapters[c]);}
const chCount=c=>V().chapters[c]||MAXCH[c]||0;
const rkey=(c,n)=>c+'.'+n;
function bookRead(c){let n=0;const tot=chCount(c);for(let i=1;i<=tot;i++) if(S.read[rkey(c,i)]) n++;return [n,tot];}
function sectionStats(list){let r=0,tot=0;for(const c of list){const [a,b]=bookRead(c);r+=a;tot+=b;}return [r,tot];}
const pct=(a,b)=>b?Math.round(a*1000/b)/10:0;

/* ---------- Liturgical season ---------- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function season(d=new Date()){
  const day=new Date(d.getFullYear(),d.getMonth(),d.getDate()),y=day.getFullYear(),DAY=864e5;
  const E=easter(y),ash=new Date(E-46*DAY),holyThu=new Date(E-3*DAY),pent=new Date(+E+49*DAY);
  const xmas=new Date(y,11,25),adv=new Date(xmas-((xmas.getDay()||7)+21)*DAY);
  const ep=new Date(y,0,6),bapt=new Date(+ep+((7-ep.getDay())%7||7)*DAY);
  if(day>=xmas||day<=bapt) return ['xmas','#8A6A12','#E3C66E'];
  if(day>=adv) return ['adv','#5E3A87','#BBA0E3'];
  if(+day===+pent) return ['pent','#A3262A','#F09090'];
  if(day>=ash&&day<holyThu) return ['lent','#5E3A87','#BBA0E3'];
  if(day>=holyThu&&day<E) return ['triduum','#A3262A','#F09090'];
  if(day>=E&&day<pent) return ['east','#8A6A12','#E3C66E'];
  return ['ord','#2E6B4E','#86C9A4'];
}
const SEASON=season();

/* ---------- Prefs ---------- */
function applyPrefs(){
  const r=document.documentElement;
  r.style.setProperty('--acc-l',SEASON[1]); r.style.setProperty('--acc-d',SEASON[2]);
  r.style.setProperty('--fs',S.fs+'px');
  if(S.mode==='auto') r.removeAttribute('data-mode'); else r.setAttribute('data-mode',S.mode);
  r.lang=S.ui; r.dir=S.ui==='ar'?'rtl':'ltr';
  const mc=document.querySelector('meta[name="theme-color"]'); if(mc) mc.content=getComputedStyle(r).getPropertyValue('--paper').trim()||'#FBFBF9';
  if(!VMAP[S.version]&&VERS.length) S.version=VERS[0].id;
}

/* ---------- Utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const plain=s=>(s||'').replace(/\u0001/g,'').replace(/\n/g,' ');
function toast(msg){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2400);}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast(t('copied'));}catch(e){
  const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('copied'));}catch(_){}ta.remove();}}
const locTag=()=>({es:'es-UY',en:'en-US',pt:'pt-BR',zh:'zh-CN',la:'it'}[S.ui]||S.ui);
function fmtDate(iso){const [y,m,d]=iso.split('-').map(Number);try{return new Date(y,m-1,d).toLocaleDateString(locTag(),{day:'numeric',month:'long',year:'numeric'});}catch(e){return iso;}}
function relTime(ts){const d=(Date.now()-ts)/1000;let rtf;try{rtf=new Intl.RelativeTimeFormat(locTag(),{numeric:'auto'});}catch(e){rtf=new Intl.RelativeTimeFormat('es',{numeric:'auto'});}
  if(d<3600) return rtf.format(-Math.max(1,Math.round(d/60)),'minute'); if(d<86400) return rtf.format(-Math.round(d/3600),'hour'); return rtf.format(-Math.round(d/86400),'day');}

/* ---------- Routing ---------- */
const ROUTES=['leer','indice','guardados','enciclicas','apocrifos'];
let route='leer';
function readRoute(){const h=location.hash.slice(1);route=ROUTES.includes(h)?h:'leer';}
function go(r){if(location.hash.slice(1)!==r) location.hash=r; else {route=r;render();}}
window.addEventListener('hashchange',()=>{readRoute();closeSheet();clearSel();render();});

/* ---------- Render shell ---------- */
function renderNav(){
  const items=[['leer','read',I.book],['indice','index',I.list],['guardados','saved',I.mark],['enciclicas','enc',I.lamp],['apocrifos','apoc',I.scroll]];
  $('#nav').innerHTML=items.map(([r,k,ic])=>`<a href="#${r}" ${route===r?'aria-current="page"':''}>${ic}<span>${t(k)}</span></a>`).join('');
}
function renderTop(){
  const top=$('#top');
  const gear=`<button class="icon-btn" id="btnSettings" aria-label="${t('settings')}">${I.gear}</button>`;
  if(route==='leer'){
    const inApoc=S.reading==='apoc'&&S.apocPos&&APOCMAP[S.apocPos.id];
    let title;
    if(inApoc){const a=APOCMAP[S.apocPos.id];title=apocName(a)+(a.ch>1?' '+S.apocPos.ch:'');}
    else title=bname(S.pos.book)+' '+S.pos.ch;
    top.innerHTML=`<button class="title" id="btnPick"><b>${esc(title)}</b><span class="caret">${I.down}</span></button>
      <button class="icon-btn" id="btnListen" aria-label="${t('listen')}">${I.audio}</button>
      ${inApoc?`<span class="chip">EN</span>`:`<button class="chip" id="btnVer">${esc(V().short)}</button>`}${gear}`;
    $('#btnPick').onclick=()=>inApoc?openApocChapters(S.apocPos.id):openChapterSheet(S.pos.book);
    $('#btnListen').onclick=()=>playerStart(firstVerseOnScreen());
    const bv=$('#btnVer'); if(bv) bv.onclick=openVersionSheet;
  } else {
    const titles={indice:t('index'),guardados:t('saved'),enciclicas:t('enc'),apocrifos:t('apoc')};
    top.innerHTML=`<div class="title" style="cursor:default"><b>${titles[route]}</b></div>${route==='indice'?`<button class="chip" id="btnVer">${esc(V().short)}</button>`:''}${gear}`;
    const bv=$('#btnVer'); if(bv) bv.onclick=openVersionSheet;
  }
  $('#btnSettings').onclick=openSettings;
}
function render(){
  renderNav(); renderTop();
  const m=$('#view');
  if(route!=='leer'&&P.on) playerStop();
  if(route==='leer') renderReader(m);
  else if(route==='indice') renderIndex(m);
  else if(route==='guardados') renderSaved(m);
  else if(route==='enciclicas') renderEnc(m);
  else if(route==='apocrifos') renderApoc(m);
}

/* ---------- Reader ---------- */
let readerToken=0, pendingVerse=null, sel=new Set(), CUR=null;
function openBible(book,ch,verse,keepAudio){
  if(!keepAudio&&P.on) playerStop();
  S.reading='bible'; S.pos={book,ch:Math.max(1,ch|0)}; pushHistory(); pendingVerse=verse||null; save();
  if(route!=='leer') go('leer'); else {closeSheet();render();}
}
function openApoc(id,ch,verse,keepAudio){
  if(!keepAudio&&P.on) playerStop();
  S.reading='apoc'; S.apocPos={id,ch:Math.max(1,ch|0)}; pushHistory(); pendingVerse=verse||null; save();
  if(route!=='leer') go('leer'); else {closeSheet();render();}
}
function pushHistory(){
  const e=S.reading==='apoc'?{k:'apoc',id:S.apocPos.id,ch:S.apocPos.ch}:{k:'bible',book:S.pos.book,ch:S.pos.ch};
  e.ts=Date.now(); const key=JSON.stringify([e.k,e.id||e.book,e.ch]);
  S.history=[e,...S.history.filter(h=>JSON.stringify([h.k,h.id||h.book,h.ch])!==key)].slice(0,20);
}
const HEADCLS={M:'hM',S:'hS',P:'hP',A:'hA',D:'hD'};
async function renderReader(m){
  const tok=++readerToken; clearSel();
  const isApoc=!!(S.reading==='apoc'&&S.apocPos&&APOCMAP[S.apocPos.id]);
  m.innerHTML=`<div class="reader"><div class="loading">${t('loading')}</div></div>`;
  const v=V();
  let chapters,heads={},lang,dir='ltr',label,key,prevT=null,nextT=null,attr='',chN,bookCode=null,hasNotes=false;
  try{
    if(isApoc){
      const a=APOCMAP[S.apocPos.id]; const d=await getJSON(apocPath(a.id)); chapters=d.chapters; lang='en';
      if(S.apocPos.ch>chapters.length) S.apocPos.ch=chapters.length; chN=S.apocPos.ch;
      label=`${apocName(a)}${chapters.length>1?' · '+t('chapter')+' '+chN:''}`; key='apoc:'+a.id+'.'+chN;
      const order=APOC.map(x=>x.id), i=order.indexOf(a.id);
      if(chN>1) prevT={l:apocName(a)+' '+(chN-1),f:k=>openApoc(a.id,chN-1,null,k)};
      else if(i>0){const p=APOCMAP[order[i-1]];prevT={l:apocName(p),f:k=>openApoc(p.id,p.ch,null,k)};}
      if(chN<chapters.length) nextT={l:apocName(a)+' '+(chN+1),f:k=>openApoc(a.id,chN+1,null,k)};
      else if(i<order.length-1){const n=APOCMAP[order[i+1]];nextT={l:apocName(n),f:k=>openApoc(n.id,1,null,k)};}
      attr=a.tr;
    } else {
      const {book}=S.pos; bookCode=book;
      if(!v.chapters[book]){ if(tok===readerToken) renderMissing(m,book); return; }
      if(S.pos.ch>v.chapters[book]) S.pos.ch=v.chapters[book]; chN=S.pos.ch;
      const bd=await getBook(v.id,book); chapters=bd.c; heads=bd.h||{}; lang=v.lang; if(lang==='ar') dir='rtl';
      hasNotes=!!v.notes&&S.notes;
      label=`${bname(book)} · ${v.name}`; key=rkey(book,chN);
      const order=readingOrder(), i=order.indexOf(book);
      if(chN>1) prevT={l:`${bname(book)} ${chN-1}`,f:k=>openBible(book,chN-1,null,k)};
      else if(i>0){const p=order[i-1];prevT={l:`${bname(p)} ${v.chapters[p]}`,f:k=>openBible(p,v.chapters[p],null,k)};}
      if(chN<v.chapters[book]) nextT={l:`${bname(book)} ${chN+1}`,f:k=>openBible(book,chN+1,null,k)};
      else if(i>=0&&i<order.length-1){const n=order[i+1];nextT={l:`${bname(n)} 1`,f:k=>openBible(n,1,null,k)};}
      attr=[v.name+' ('+v.year+')',v.attribution||v.license].filter(Boolean).join(' · ');
      if(book==='Ps'&&['es-platense','en-drc','en-cpdv','la-vulg','fr-crampon'].includes(v.id)) attr=t('vulgNum')+' '+attr;
    }
  }catch(e){
    if(tok!==readerToken) return;
    m.innerHTML=`<div class="reader"><div class="notice">${t('loadErr')}<div class="row"><button class="btn small" id="retry">${t('retry')}</button></div></div></div>`;
    $('#retry').onclick=()=>render(); return;
  }
  if(tok!==readerToken) return;
  const verses=chapters[chN-1]||[];
  const flow=!isApoc&&S.flow;
  const hlPrefix=isApoc?('apoc:'+S.apocPos.id+'.'+chN+'.'):(S.pos.book+'.'+chN+'.');
  const headHTML=n=>{ if(isApoc||!S.heads) return ''; const hs=heads[chN+'.'+n]; if(!hs) return '';
    return hs.map(([ty,tx])=>`<h3 class="hd ${HEADCLS[ty]||'hS'}">${esc(tx)}</h3>`).join(''); };
  const verseText=(txt)=>{ let k=0; return esc(txt).replace(/\u0001/g,()=>hasNotes?`<button class="fn" data-k="${k++}" aria-label="${t('noteT')}">*</button>`:(k++,'')); };
  let html='';
  if(flow){
    let para='';
    verses.forEach((txt,i)=>{ const n=i+1; const h=headHTML(n);
      if(h){ if(para) html+=`<p class="flowp">${para}</p>`; para=''; html+=h; }
      if(!txt) return;
      para+=`<span class="v${S.hl[hlPrefix+n]?' hl':''}" data-v="${n}"><sup>${n}</sup>${verseText(txt.replace(/\n/g,' '))} </span>`; });
    if(para) html+=`<p class="flowp">${para}</p>`;
  } else {
    verses.forEach((txt,i)=>{ const n=i+1; html+=headHTML(n); if(!txt) return;
      html+=`<div class="v vv${S.hl[hlPrefix+n]?' hl':''}" data-v="${n}"><span class="n" aria-hidden="true">${n}</span><span class="t"><span class="sr">${n}. </span>${verseText(txt)}</span></div>`; });
  }
  const done=!!S.read[key];
  const chk=I.check.replace('<svg','<svg width="18" height="18"');
  m.innerHTML=`<article class="reader" lang="${lang}" dir="${dir}">
    <h2 dir="${S.ui==='ar'?'rtl':'ltr'}">${esc(label)}</h2>
    <div class="chnum" aria-hidden="true">${chN}</div>
    <div class="text ${flow?'flow':(isApoc?'prose':'sep')}">${html}</div>
    <div class="chap-end" dir="${S.ui==='ar'?'rtl':'ltr'}">
      <button class="readbtn ${done?'done':''}" id="btnRead" aria-pressed="${done}">${done?chk+' '+t('isRead'):t('markRead')}</button>
      <div class="pn"><button id="btnPrev" ${prevT?'':'disabled'}><small>${t('prev')}</small>${prevT?esc(prevT.l):''}</button>
        <button id="btnNext" ${nextT?'':'disabled'}><small>${t('next')}</small>${nextT?esc(nextT.l):''}</button></div>
      <p class="attrib">${esc(attr)}</p>
    </div></article>`;
  CUR={isApoc,verses,heads,chN,lang,hlPrefix,prevT,nextT,key,bookCode,vid:v.id};
  $('#btnRead').onclick=()=>{ if(S.read[key]) delete S.read[key]; else S.read[key]=Date.now(); save(); const d=!!S.read[key];
    const b=$('#btnRead'); b.classList.toggle('done',d); b.setAttribute('aria-pressed',d); b.innerHTML=d?chk+' '+t('isRead'):t('markRead'); };
  if(prevT) $('#btnPrev').onclick=()=>prevT.f(); if(nextT) $('#btnNext').onclick=()=>nextT.f();
  m.querySelector('.text').addEventListener('click',e=>{
    const fn=e.target.closest('.fn'); if(fn){ const vv=fn.closest('.v'); openNote(+vv.dataset.v,+fn.dataset.k); return; }
    const s=e.target.closest('.v'); if(s) toggleSel(s); });
  swipe(m,prevT,nextT);
  if(S.autoRead){ const end=$('#btnRead'); const io=new IntersectionObserver(es=>{ if(es[0].isIntersecting&&!S.read[key]&&tok===readerToken){ S.read[key]=Date.now(); save();
      end.classList.add('done'); end.innerHTML=chk+' '+t('isRead'); io.disconnect(); } },{root:m,threshold:1}); io.observe(end); }
  if(pendingVerse){ const el=m.querySelector(`.v[data-v="${pendingVerse}"]`); pendingVerse=null;
    if(el){ requestAnimationFrame(()=>{ el.scrollIntoView({block:'center'}); el.classList.add('flash'); }); } }
  else m.scrollTop=0;
  if(P.on&&P.auto){ P.auto=false; playerStart(1); }
}
async function openNote(vn,k){
  if(!CUR||CUR.isApoc) return;
  const ref=`${bname(CUR.bookCode)} ${CUR.chN}${sep()}${vn}`;
  const sh=openSheet(`${t('noteT')} · ${ref}`,`<div class="loading">${t('loading')}</div>`);
  try{ const n=await getNotes(CUR.vid,CUR.bookCode); const list=n[CUR.chN+'.'+vn]||[]; const tx=list[k]||list.join('\n\n');
    const b=sh.querySelector('.sb'); if(b) b.innerHTML=`<div class="notetext" lang="${CUR.lang}">${esc(tx).replace(/\n/g,'<br>')}</div>`;
  }catch(e){ const b=sh.querySelector('.sb'); if(b) b.innerHTML=`<p class="sub">${t('loadErr')}</p>`; }
}
function renderMissing(m,book){
  const others=VERS.filter(x=>x.chapters[book]);
  m.innerHTML=`<div class="reader"><div class="notice"><b>${esc(bname(book))}</b> ${t('notIn')} (${esc(V().name)}).
    <div style="margin-top:8px">${t('tryOther')}</div><div class="row">${others.slice(0,8).map(x=>`<button class="chip" data-v="${x.id}">${esc(x.short)} · ${LANGS[x.lang]}</button>`).join('')}</div></div></div>`;
  m.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.version=b.dataset.v;save();render();});
}
function swipe(el,prevT,nextT){
  let x0=null,y0=null;
  el.ontouchstart=e=>{if(sel.size) return; x0=e.touches[0].clientX;y0=e.touches[0].clientY;};
  el.ontouchend=e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    const rtl=document.documentElement.dir==='rtl';
    if(Math.abs(dx)>90&&Math.abs(dy)<45){ const fwd=rtl?dx>0:dx<0; if(fwd&&nextT) nextT.f(); else if(!fwd&&prevT) prevT.f(); } };
}
function firstVerseOnScreen(){
  const m=$('#view'); const top=m.getBoundingClientRect().top;
  for(const el of m.querySelectorAll('.v')){ if(el.getBoundingClientRect().bottom>top+8) return +el.dataset.v; }
  return 1;
}
/* selection / action bar */
function clearSel(){sel.clear();document.querySelectorAll('.v.sel').forEach(x=>x.classList.remove('sel'));const ab=$('.actionbar');if(ab)ab.remove();}
function toggleSel(span){
  const n=+span.dataset.v;
  if(sel.has(n)){sel.delete(n);span.classList.remove('sel');} else {sel.add(n);span.classList.add('sel');}
  if(!sel.size){clearSel();return;}
  let ab=$('.actionbar');
  if(!ab){ab=document.createElement('div');ab.className='actionbar';ab.setAttribute('role','toolbar');document.body.appendChild(ab);}
  const allHl=[...sel].every(n=>S.hl[CUR.hlPrefix+n]);
  ab.innerHTML=`<div class="ref">${esc(selRef())}</div>
    <button id="abListen">${I.audio}${t('listen')}</button><button id="abSave">${I.mark}${t('save')}</button><button id="abHl">${I.pen}${allHl?t('unhl'):t('highlight')}</button>
    <button id="abCopy">${I.copy}${t('copy')}</button><button id="abX" aria-label="${t('close')}">${I.x}</button>`;
  $('#abX').onclick=clearSel;
  $('#abListen').onclick=()=>{const f=Math.min(...sel);clearSel();playerStart(f);};
  $('#abCopy').onclick=()=>{copyText(selText()+'\n— '+selRef()+(CUR.isApoc?'':' ('+V().short+')'));clearSel();};
  $('#abHl').onclick=()=>{ [...sel].forEach(n=>{const k=CUR.hlPrefix+n; if(allHl) delete S.hl[k]; else S.hl[k]=1;
      const sp=document.querySelector(`.v[data-v="${n}"]`); if(sp) sp.classList.toggle('hl',!allHl);}); save(); clearSel(); };
  $('#abSave').onclick=()=>openBookmarkSheet();
}
function rangeStr(arr){arr=[...arr].sort((a,b)=>a-b);const out=[];let s=arr[0],p=arr[0];for(let i=1;i<=arr.length;i++){if(arr[i]===p+1){p=arr[i];continue;}out.push(s===p?s:s+'-'+p);s=p=arr[i];}return out.join('.');}

/* ---------- Audio (text to speech) ---------- */
const TTSLANG={es:'es',en:'en',la:'it',pt:'pt',fr:'fr',it:'it',de:'de',ru:'ru',uk:'uk',cu:'ru',el:'el',zh:'zh',ja:'ja',ko:'ko',ar:'ar',vi:'vi'};
const PREF_REGION={es:['es-419','es-US','es-MX','es-AR','es-ES'],en:['en-US','en-GB'],pt:['pt-BR','pt-PT'],zh:['zh-CN','zh-TW'],fr:['fr-FR'],it:['it-IT'],de:['de-DE']};
const TTS={
  cap(){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.TextToSpeech;},
  ok(){return !!(this.cap()||('speechSynthesis' in window));},
  voices(base){ if(this.cap()||!('speechSynthesis' in window)) return []; return speechSynthesis.getVoices().filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(base)); },
  pick(base){ const want=S.tts.voice[base]; const vs=this.voices(base); if(!vs.length) return null;
    if(want){const w=vs.find(v=>v.voiceURI===want); if(w) return w;}
    for(const r of (PREF_REGION[base]||[])){const f=vs.find(v=>v.lang.replace('_','-').toLowerCase()===r.toLowerCase()); if(f) return f;}
    return vs.find(v=>v.localService)||vs[0]; },
  speak(text,base,rate){ return new Promise((res,rej)=>{
    const c=this.cap();
    if(c){ c.speak({text,lang:(PREF_REGION[base]||[base])[0],rate,category:'playback'}).then(res,rej); return; }
    const u=new SpeechSynthesisUtterance(text); const v=this.pick(base); if(v){u.voice=v;u.lang=v.lang;} else u.lang=base; u.rate=rate;
    u.onend=()=>res(); u.onerror=e=>(e.error==='interrupted'||e.error==='canceled')?res():rej(e);
    speechSynthesis.speak(u); }); },
  stop(){ const c=this.cap(); if(c){c.stop().catch(()=>{});} else if('speechSynthesis' in window) speechSynthesis.cancel(); }
};
if('speechSynthesis' in window){ try{speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{};}catch(e){} }
const P={on:false,playing:false,items:[],idx:0,tok:0,auto:false,lock:null};
function buildItems(from){
  const items=[];
  CUR.verses.forEach((txt,i)=>{ const n=i+1; if(n<from) return;
    if(!CUR.isApoc&&S.tts.heads&&S.heads){ const hs=CUR.heads[CUR.chN+'.'+n]; if(hs) hs.forEach(h=>items.push({v:n,text:h[1]})); }
    if(txt) items.push({v:n,text:plain(txt)}); });
  return items;
}
async function playerStart(from){
  if(!CUR) return;
  if(!TTS.ok()){toast(t('noTts'));return;}
  const base=TTSLANG[CUR.lang]||CUR.lang;
  if(!TTS.cap()&&'speechSynthesis' in window){ if(!speechSynthesis.getVoices().length) await new Promise(r=>setTimeout(r,400)); if(!TTS.voices(base).length) toast(t('noVoice')); }
  TTS.stop(); P.on=true; P.items=buildItems(from||1); P.idx=0; P.base=base; drawPlayer(); playerRun();
}
async function playerRun(){
  const tok=++P.tok; P.playing=true; drawPlayer(); wake(true);
  while(P.idx<P.items.length&&tok===P.tok){
    const it=P.items[P.idx]; markSpeaking(it.v);
    try{ await TTS.speak(it.text,P.base,S.tts.rate); }catch(e){ if(tok===P.tok){ P.playing=false; drawPlayer(); wake(false); } return; }
    if(tok!==P.tok) return; P.idx++;
  }
  if(tok!==P.tok) return;
  markSpeaking(null);
  if(S.tts.next&&CUR&&CUR.nextT){ if(S.autoRead){S.read[CUR.key]=Date.now();save();} P.auto=true; CUR.nextT.f(true); return; }
  playerStop();
}
function playerPause(){ P.tok++; TTS.stop(); P.playing=false; drawPlayer(); wake(false); }
function playerStop(){ P.tok++; TTS.stop(); P.on=false; P.playing=false; P.auto=false; markSpeaking(null); const pb=$('.player'); if(pb) pb.remove(); document.body.classList.remove('has-player'); wake(false); }
function markSpeaking(v){ document.querySelectorAll('.v.speaking').forEach(x=>x.classList.remove('speaking'));
  if(v==null) return; const el=document.querySelector(`.v[data-v="${v}"]`); if(el){ el.classList.add('speaking'); const m=$('#view'),r=el.getBoundingClientRect(),mr=m.getBoundingClientRect();
    if(r.top<mr.top+40||r.bottom>mr.bottom-120) el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
  const lab=$('.player .plab'); if(lab&&CUR) lab.textContent=(CUR.isApoc?apocName(APOCMAP[S.apocPos.id]):bname(CUR.bookCode))+' '+CUR.chN+(v?sep()+v:''); }
const RATES=[0.75,0.9,1,1.15,1.3,1.5];
function drawPlayer(){
  if(!P.on) return; let pb=$('.player');
  if(!pb){pb=document.createElement('div');pb.className='player';pb.setAttribute('role','region');pb.setAttribute('aria-label',t('audio'));document.body.appendChild(pb);document.body.classList.add('has-player');}
  pb.innerHTML=`<button class="pbtn main" id="pPlay" aria-label="${P.playing?t('pause'):t('play')}">${P.playing?I.pause:I.play}</button>
    <div class="plab" aria-live="polite"></div>
    <button class="chip" id="pRate" aria-label="${t('speed')}">${S.tts.rate}×</button>
    <button class="pbtn" id="pStop" aria-label="${t('stop')}">${I.x}</button>`;
  $('#pPlay').onclick=()=>P.playing?playerPause():playerRun();
  $('#pStop').onclick=playerStop;
  $('#pRate').onclick=()=>{const i=RATES.indexOf(S.tts.rate);S.tts.rate=RATES[(i+1)%RATES.length];save();if(P.playing){P.tok++;TTS.stop();setTimeout(playerRun,60);}else drawPlayer();};
  markSpeaking(P.items[P.idx]?P.items[P.idx].v:null);
}
async function wake(on){ try{ if(on&&!P.lock&&navigator.wakeLock) P.lock=await navigator.wakeLock.request('screen'); else if(!on&&P.lock){P.lock.release();P.lock=null;} }catch(e){} }

    <div class="seg" role="group"><button data-tab="ot" aria-pressed="${idxTab==='ot'}">${t('ot')}</button><button data-tab="nt" aria-pressed="${idxTab==='nt'}">${t('nt')}</button></div>
    <p class="sub">${avail} ${t('of')} ${totB} ${t('books')} ${t('available')} · ${esc(v.name)}</p>
    ${groups.map(gr=>`<div class="group">${t(gr.g==='apoc'?'apocG':gr.g)}</div><div class="list">${gr.books.map(b=>{
      const [r,n]=bookRead(b.c); const done=n&&r===n;
      return `<button class="row ${b.has?'':'off'}" data-b="${b.c}"><div class="main"><div class="name">${esc(bname(b.c))}</div>
        <div class="meta">${n} ${n===1?t('chap1'):t('chapters')}${r?` · ${r} ${t('readN')}`:''}${b.has?'':' · '+t('notIn')}</div>${r&&!done?`<div class="bar"><i style="width:${pct(r,n)}%"></i></div>`:''}</div>
        <span class="check ${done?'on':''}">${I.check}</span></button>`;}).join('')}</div>`).join('')}
  </div>`;
  m.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{S.tradition=b.dataset.tr;save();render();});
  m.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{idxTab=b.dataset.tab;render();});
  m.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>openChapterSheet(b.dataset.b));
  $('#srch').onsubmit=e=>{e.preventDefault();doSearch($('#q').value.trim());};
  if(searchState&&searchState.vid===v.id){$('#q').value=searchState.q;showResults();}
}
function aliasMap(){
  if(aliasMap.m) return aliasMap.m; const m=new Map();
  const add=(k,c)=>{k=norm(k).replace(/[\s.]/g,''); if(k&&!m.has(k)) m.set(k,c);};
  if(LOC) for(const [c,n] of Object.entries(LOC.b)) add(n,c);
  for(const [c,[es,en,ab]] of Object.entries(BOOKS)){add(es,c);add(en,c);add(ab,c);add(c,c);}
  for(const [c,list] of Object.entries(EXTRA_ALIASES)) list.forEach(a=>add(a,c));
  return aliasMap.m=m;
}
function parseRef(q){
  const s=norm(q).trim(); const mt=s.match(/^([1-4]?\s*[^\d\s][^\d]*?)\s*(\d+)(?:\s*[:,.\s]\s*(\d+))?$/u); if(!mt) return null;
  const key=mt[1].replace(/[\s.]/g,''); const am=aliasMap(); let c=am.get(key);
  if(!c){ const cands=[...am.keys()].filter(k=>k.startsWith(key)&&key.length>=2); if(cands.length){ const O=Object.keys(BOOKS); cands.sort((a,b)=>O.indexOf(am.get(a))-O.indexOf(am.get(b))||a.length-b.length); c=am.get(cands[0]); } }
  if(!c) return null; return {book:c,ch:+mt[2],v:mt[3]?+mt[3]:null};
}
async function doSearch(q){
  if(!q) return;
  const ref=parseRef(q);
  if(ref&&chCount(ref.book)){ openBible(ref.book,Math.min(ref.ch,chCount(ref.book)),ref.v); return; }
  const v=V(); const nq=norm(q); if(nq.length<2) return;
  const order=canonList(S.tradition).filter(c=>v.chapters[c]);
  const st=searchState={q,vid:v.id,res:[],done:0,total:order.length,running:true}; showResults();
  for(const c of order){
    if(searchState!==st) return;
    try{ const bd=await getBook(v.id,c);
      bd.c.forEach((vs,ci)=>vs.forEach((tx,vi)=>{ if(tx&&st.res.length<200){const p=plain(tx); if(norm(p).includes(nq)) st.res.push({c,ch:ci+1,v:vi+1,tx:p});} })); }catch(e){}
    st.done++; if(st.done%6===0||st.done===st.total) showResults();
    if(st.res.length>=200) break;
  }
  st.running=false; showResults();
}
function showResults(){
  const box=$('#sres'); if(!box||!searchState) return; const st=searchState;
  const hl=tx=>{ const n=norm(tx), q=norm(st.q); if(n.length!==tx.length) return esc(tx); let out='',i=0,j; while((j=n.indexOf(q,i))>=0){ out+=esc(tx.slice(i,j))+'<mark>'+esc(tx.slice(j,j+q.length))+'</mark>'; i=j+q.length; } return out+esc(tx.slice(i)); };
  box.innerHTML=`<p class="sub">${st.running?`${t('searching')}… ${st.done}/${st.total} ${t('books')} · `:''}${st.res.length} ${t('results')}${st.res.length>=200?' · '+t('moreRes'):''}</p>
    ${!st.running&&!st.res.length?`<p class="sub">${t('noRes')}</p>`:''}
    <div>${st.res.map((r,i)=>`<button class="result" data-i="${i}"><b>${esc(bname(r.c))} ${r.ch}${sep()}${r.v}</b><p>${hl(r.tx)}</p></button>`).join('')}</div>`;
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const r=st.res[+b.dataset.i];openBible(r.c,r.ch,r.v);});
}

/* ---------- Saved ---------- */
function renderSaved(m){
  const inApoc=S.reading==='apoc'&&S.apocPos&&APOCMAP[S.apocPos.id];
  const posTitle=inApoc?apocName(APOCMAP[S.apocPos.id])+' '+S.apocPos.ch:`${bname(S.pos.book)} ${S.pos.ch}`;
  const hist=S.history.slice(1,8);
  m.innerHTML=`<div class="pad">
    <button class="card" id="cont"><div class="k">${t('continue')}</div><div class="t">${esc(posTitle)}</div><div class="sub" style="margin:0">${inApoc?'EN':esc(V().name)}</div></button>
    ${hist.length?`<div class="group">${t('history')}</div><div class="list">${hist.map((h,i)=>{
      const nm=h.k==='apoc'?(APOCMAP[h.id]?apocName(APOCMAP[h.id]):h.id):bname(h.book);
      return `<button class="row" data-h="${i+1}"><div class="main"><div class="name">${esc(nm)} ${h.ch}</div><div class="meta">${relTime(h.ts)}</div></div></button>`;}).join('')}</div>`:''}
    <div class="group">${t('bookmarks')}</div>
    ${S.bookmarks.length?S.bookmarks.map((b,i)=>`<div class="card"><div class="k">${esc(b.ref)}${b.ver&&VMAP[b.ver]?' · '+esc(VMAP[b.ver].short):''}</div>
      <p>${esc(b.text)}</p>${b.note?`<div class="note">${esc(b.note)}</div>`:''}
      <div class="acts">${b.k==='enc'?`<a class="btn small" href="${esc(b.u)}" target="_blank" rel="noopener">${t('readOn')}</a>`:`<button class="btn small" data-o="${i}">${t('open')}</button>`}<button class="btn ghost small" data-d="${i}">${t('del')}</button></div></div>`).join(''):`<p class="empty">${t('noBm')}</p>`}
  </div>`;
  $('#cont').onclick=()=>{ if(inApoc) openApoc(S.apocPos.id,S.apocPos.ch); else openBible(S.pos.book,S.pos.ch); };
  m.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const h=S.history[+b.dataset.h]; if(h.k==='apoc') openApoc(h.id,h.ch); else openBible(h.book,h.ch);});
  m.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const x=S.bookmarks[+b.dataset.o]; if(x.k==='apoc') openApoc(x.id2,x.ch,x.v); else { if(x.ver&&VMAP[x.ver]) S.version=x.ver; openBible(x.book,x.ch,x.v);} });
  m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.bookmarks.splice(+b.dataset.d,1);save();render();});
}

/* ---------- Encyclicals ---------- */
let encFilter='all', encQ='';
function renderEnc(m){
  const all=ENC.flatMap(p=>p.items), nRead=all.filter(e=>S.enc[e.id]).length;
  m.innerHTML=`<div class="pad">
    <p class="sub">${t('encIntro')}</p>
    <div class="stats" style="grid-template-columns:1fr"><div class="stat"><b>${nRead} / ${all.length}</b><span>${t('encRead')}</span><div class="bar"><i style="width:${pct(nRead,all.length)}%"></i></div></div></div>
    <div class="search"><input id="eq" type="search" placeholder="${t('filterPh')}" value="${esc(encQ)}" aria-label="${t('filterPh')}"></div>
    <div class="seg" role="group">${[['all','all'],['pending','pending'],['read','readF']].map(([k,l])=>`<button data-f="${k}" aria-pressed="${encFilter===k}">${t(l)}</button>`).join('')}</div>
    <div id="elist"></div></div>`;
  const draw=()=>{ const ql=norm(encQ); const box=$('#elist');
    box.innerHTML=ENC.map(p=>{ const items=p.items.filter(e=>(encFilter==='all'||(encFilter==='read'?S.enc[e.id]:!S.enc[e.id]))&&(!ql||norm(e.t+' '+e.s+' '+e.tags.join(' ')).includes(ql)));
      if(!items.length) return ''; const rd=p.items.filter(e=>S.enc[e.id]).length;
      return `<div class="pope"><h3>${esc(p.pope)}</h3><span>${p.years} · ${rd}/${p.items.length}</span></div>`+items.map(e=>{const on=!!S.enc[e.id];const bm=S.bookmarks.some(b=>b.k==='enc'&&b.eid===e.id);
        return `<div class="enc"><div class="t">${esc(e.t)}</div><div class="d">${fmtDate(e.d)} ${e.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join(' ')}</div><p lang="es">${esc(e.s)}</p>
          <div class="acts"><a class="btn small" href="${e.u}" target="_blank" rel="noopener">${t('readOn')}</a>
          <button class="toggle ${on?'on':''}" data-e="${e.id}" aria-pressed="${on}">${on?I.check+t('readDone'):t('markEnc')}</button>
          <button class="icon-btn" data-eb="${e.id}" aria-label="${t('save')}" aria-pressed="${bm}" style="color:${bm?'var(--accent)':''}">${bm?I.markF:I.mark}</button></div></div>`;}).join('');}).join('')||`<p class="empty">—</p>`;
    box.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const id=b.dataset.e; if(S.enc[id]) delete S.enc[id]; else S.enc[id]=Date.now(); save(); renderEnc(m);});
    box.querySelectorAll('[data-eb]').forEach(b=>b.onclick=()=>{const id=b.dataset.eb; const i=S.bookmarks.findIndex(x=>x.k==='enc'&&x.eid===id);
      if(i>=0) S.bookmarks.splice(i,1); else { const e=all.find(x=>x.id===id); S.bookmarks.unshift({id:Date.now().toString(36),ts:Date.now(),k:'enc',eid:id,ref:e.t+' · '+fmtDate(e.d),text:e.s,note:'',u:e.u}); toast(t('bmSaved')); }
      save(); draw(); });
  };
  draw();
  const qi=$('#eq'); qi.oninput=()=>{encQ=qi.value;draw();};
  m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{encFilter=b.dataset.f;renderEnc(m);});
}

/* ---------- Apocrypha ---------- */
function renderApoc(m){
  const groups=[['ot','g_ot'],['t12','g_t12'],['gos','g_gos'],['acts','g_acts'],['af','g_af']];
  m.innerHTML=`<div class="pad"><p class="sub">${t('apocIntro')}</p>
    ${groups.map(([g,l])=>`<div class="group">${t(l)}</div><div class="list">${APOC.filter(a=>a.group===g).map(a=>{
      let r=0; for(let i=1;i<=a.ch;i++) if(S.read['apoc:'+a.id+'.'+i]) r++; const done=r===a.ch;
      return `<button class="row" data-a="${a.id}"><div class="main"><div class="name">${esc(apocName(a))}</div>
        <div class="meta">${a.ch>1?a.ch+' '+t('chapters'):''}${a.desc&&S.ui==='es'?(a.ch>1?' · ':'')+esc(a.desc):''}</div>${r&&!done?`<div class="bar"><i style="width:${pct(r,a.ch)}%"></i></div>`:''}</div>
        <span class="check ${done?'on':''}">${I.check}</span></button>`;}).join('')}</div>`).join('')}
    <p class="attrib" style="margin-top:20px">Ante-Nicene Fathers (Roberts &amp; Donaldson, 1885–1896) · scrollmapper/bible_databases_deuterocanonical.</p></div>`;
  m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>openApocChapters(b.dataset.a));
}

/* ---------- Init ---------- */
(async function init(){
  readRoute(); applyPrefs();
  $('#view').innerHTML=`<div class="loading">…</div>`;
  idb=await idbOpen();
  try{
    const [vers,enc,apoc]=await Promise.all([getJSON('data/versions.json'),getJSON('data/encyclicals.json'),getJSON('data/apoc/index.json')]);
    VERS=vers; VERS.forEach(v=>{VMAP[v.id]=v; for(const [c,n] of Object.entries(v.chapters)) MAXCH[c]=Math.max(MAXCH[c]||0,n);});
    ENC=enc; APOC=apoc; APOC.forEach(a=>APOCMAP[a.id]=a);
    await loadLocale();
  }catch(e){
    $('#view').innerHTML=`<div class="pad"><div class="notice">${t('loadErr')}</div></div>`; return;
  }
  applyPrefs(); render();
  connectRemote();
  if('serviceWorker' in navigator && !window.Capacitor){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
})();

</script>
