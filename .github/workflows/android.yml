name: Android APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK (preinstalled on runner)
        run: echo "sdk.dir=$ANDROID_HOME" && ls $ANDROID_HOME/platforms
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#24543E' --splashBackgroundColor '#FBFBF9' || true
      - run: npx cap sync android
      - name: Native voice engine (sherpa-onnx)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # Pinned to 1.x: from 2.0 the VITS/Piper espeak-ng phonemizer (dataDir) is ignored and Piper voices produce no audio.
          SHERPA_TAG=v1.13.5
          REL=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/$SHERPA_TAG)
          TAG=$(echo "$REL" | jq -r .tag_name); echo "sherpa-onnx $TAG"
          echo "$REL" | jq -r '.assets[].name' | grep -iE 'aar|android' | head -20
          URL=$(echo "$REL" | jq -r '.assets[] | select(.name|test("^sherpa-onnx-[0-9.]+\\.aar$")) | .browser_download_url' | head -1)
          echo "AAR: $URL"
          mkdir -p android/app/libs && curl -sfL "$URL" -o android/app/libs/sherpa-onnx.aar
          curl -sfL "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$TAG/sherpa-onnx/kotlin-api/Tts.kt" -o Tts.kt || true
          python3 ci/patch-android.py
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Sign with the app's fixed key (so updates install over the previous version)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.p12
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            "$BT/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-key-alias biblia --ks-pass env:KS_PW --key-pass env:KS_PW --out SagradaBiblia.apk "$APK"
            "$BT/apksigner" verify --print-certs SagradaBiblia.apk | head -3
            rm -f ks.p12
          else
            echo "::warning::No signing key configured; using a temporary debug key."
            cp "$APK" SagradaBiblia.apk
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sagrada Biblia 1.0.${{ github.run_number }}
          files: SagradaBiblia.apk
